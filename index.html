<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gif Sreach Engine</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="nav">
        <a href="index.html" class="logo"><img src="./ass/logo.jpg" alt="logo" width="50px" height="50px">Gif Search Engine</a>
        <button class="burger" id="burger" aria-label="Menu">&#9776;</button>
        <nav id="menu">
            <a href="index.html" class="on">Home</a>
            <a href="trending.html">Trending</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
       <section class="hero">
        <h1>Discover Terrifying and Funny Gifs</h1>
        <p>Search the endless archive, and look what everyone else is laughing at.</p>
        <div class="search">
            <input type="text" id="searchInput" placeholder="Search Gifs: Bats, rats, or a witches hat...">
            <button id="searchBtn">Search</button>
        </div>
       </section>

       <section>
        <h2 id="sectionTitle">Trending Gifs</h2>
        <p id="status" role="status"></p>
        <div id="gifGrid" class="grid"></div>
       </section>
    </main>

    <footer>
        <strong class="logo">Gif Search</strong>
        <span>&copy; 2026 Gif Search Engine. Student Project.</span>
        <nav>
            <a href="index.html">Home</a>
            <a href="trending.html">Trending</a>
            <a href="contact.html">Contact</a>
        </nav>
    </footer>

    <div class="modal" id="modal" hidden>
        <div class="modal-box" role="dialog" aria-modal="true">
            <button class="close" id="closeModal" aria-label="Close">&times;</button>
            <img alt="" id="modalImg">
            <h3 id="modalTitle"></h3>
            <div class="actions">
                <button id="copyBtn">Copy Gif URL</button>
                <a id="giphyLink" target="_blank" rel="noopener">Open on Giphy</a>
            </div>
            <p id="copyMsg" role="status"></p>
        </div>
    </div>

    
    <script src="./js/app.js"></script>
</body>
</html>
